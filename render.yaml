services:

  # ==========================================
  # FASTAPI BACKEND
  # ==========================================

  - type: web
    name: stock-ai-backend
    env: python

    buildCommand: |
      pip install -r requirements.txt

    startCommand: |
      uvicorn backend.app:app --host 0.0.0.0 --port 10000

    envVars:
      - key: PYTHON_VERSION
        value: 3.11

  # ==========================================
  # STREAMLIT FRONTEND
  # ==========================================

  - type: web
    name: stock-ai-frontend
    env: python

    buildCommand: |
      pip install -r requirements.txt

    startCommand: |
      streamlit run frontend/streamlit_app.py --server.port 10000 --server.address 0.0.0.0

    envVars:
      - key: PYTHON_VERSION
        value: 3.11